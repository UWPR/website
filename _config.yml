title: "University of Washington Proteomics Resource"
masthead_title: "UWPR"
description: "Web site for the University of Washington's Proteomics Resource"
url: "https://uwpr.github.io"
baseurl: "/website"

remote_theme: "mmistakes/minimal-mistakes@4.26.2"

# Enable MM's breadcrumb trail on every page (except the home page).
# The include at _includes/breadcrumbs.html overrides the theme default
# so intermediate labels come from each page's `title` front matter
# instead of a capitalized URL slug (e.g. "LC-MS" not "Protocols05").
breadcrumbs: true

search: true
search_full_content: true
search_provider: lunr
lunr:
  search_within_pages: true

plugins:
  - jekyll-include-cache

# Tell Jekyll to read _pages/ directory
include:
  - _pages

# Exclude PHP files and other non-Jekyll content from the build
exclude:
  - "*.php"
  - "commands.txt"
  - "Gemfile"
  - "Gemfile.lock"
  - "vendor"
  - "internal"

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: false
      sidebar: false

# Navigation (top menu bar)
header_pages: []

# Main navigation links
navigation:
  - title: "Home"
    url: /
  - title: "Collaborate"
    url: /collaborate/
  - title: "Resources"
    url: /resources/
  - title: "Methods"
    url: /methods/
  - title: "Tools"
    url: /tools/
  - title: "Publications"
    url: /publications/
  - title: "Contact"
    url: /contact/
